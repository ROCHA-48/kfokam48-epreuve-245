services:
  db:
    image: postgres:16-alpine
    container_name: kfokam48-db
    environment:
      POSTGRES_DB: kfokam48
      POSTGRES_USER: kfokam48
      POSTGRES_PASSWORD: kfokam48
    ports:
      - "5433:5432"   # 5432 est deja pris sur ce poste : on decale pour ne rien casser
    volumes:
      - kfokam48-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kfokam48 -d kfokam48"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kfokam48-db-data:
