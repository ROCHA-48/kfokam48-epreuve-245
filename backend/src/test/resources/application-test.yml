spring:
  datasource:
    url: jdbc:h2:mem:kfokam48-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      # Autorise uniquement dans les tests (B5) : en production, c'est Flyway.
      ddl-auto: create-drop
    open-in-view: false

  flyway:
    enabled: false

app:
  presence:
    validite-code-minutes: 15
    tentatives-max: 5
    blocage-minutes: 2
